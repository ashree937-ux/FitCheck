version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitcheck_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitcheck_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  server:
    build: ./server
    container_name: fitcheck_gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fitcheck_db
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules

  ai_engine:
    build: ./ai_engine
    container_name: fitcheck_ai
    ports:
      - "8000:8000"
    volumes:
      - ./ai_engine:/app

volumes:
  pgdata: